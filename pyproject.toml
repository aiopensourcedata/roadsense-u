[build-system]
requires = ["setuptools>=84.1.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense-u"
version = "0.1.0"
description = "Research prototype for camera-based traffic interaction analysis"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
 "Development Status :: 3 - Alpha", "Intended Audience :: Science/Research",
 "Programming Language :: Python :: 3 :: Only", "Topic :: Scientific/Engineering :: Image Processing"
]
requires-python = ">=3.11,<3.14"
dependencies = [
 "numpy>=1.26,<3", "pandas>=2.2,<4", "opencv-python-headless>=4.9,<5", "scipy>=1.12,<2",
 "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "fastapi>=0.115,<1",
 "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4",
 "pydantic-settings>=2.4,<3", "httpx>=0.27,<1", "pyyaml>=6,<7", "psutil>=6,<8"
]
[project.urls]
Homepage = "https://github.com/aiopensourcedata/roadsense-u"
Repository = "https://github.com/aiopensourcedata/roadsense-u"
Issues = "https://github.com/aiopensourcedata/roadsense-u/issues"

[project.optional-dependencies]
vision = ["ultralytics-opencv-headless>=8.4,<9", "lap>=0.5,<0.6", "filelock>=4.2.1,<5"]
dashboard = ["streamlit>=1.66,<2", "altair>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "twine>=6,<7"]
review = ["matplotlib>=3.8,<4"]
e2e = ["playwright>=1.48,<2"]
audit = ["pip-audit>=2.8,<3", "bandit>=1.8,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
