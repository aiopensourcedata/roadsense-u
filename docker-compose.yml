services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roadsense
      POSTGRES_USER: roadsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadsense -d roadsense"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      ROADSENSE_DATABASE_URL: postgresql+psycopg://roadsense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/roadsense
      ROADSENSE_API_KEY: ${ROADSENSE_API_KEY:?Set ROADSENSE_API_KEY in .env}
      ROADSENSE_RETENTION_DAYS: ${ROADSENSE_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  dashboard:
    build: .
    command: ["streamlit", "run", "src/roadsense/dashboard/app.py", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    environment:
      ROADSENSE_API_URL: http://api:8000
      ROADSENSE_API_KEY: ${ROADSENSE_API_KEY:?Set ROADSENSE_API_KEY in .env}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./outputs:/app/outputs:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
