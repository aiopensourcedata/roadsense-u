# Independent local lab; use -p roadsense-enterprise to keep existing volumes separate.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roadsense_enterprise
      POSTGRES_USER: roadsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - enterprise_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadsense -d roadsense_enterprise"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  api:
    build: .
    env_file:
      - ${ROADSENSE_CREDENTIAL_DIR:-./outputs/cloud-enterprise/credentials}/server.env
    environment:
      ROADSENSE_DATABASE_URL: postgresql+psycopg://roadsense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/roadsense_enterprise
      ROADSENSE_AUTO_MIGRATE: "false"
      ROADSENSE_RETENTION_INTERVAL_S: "60"
    command: ["sh", "-c", "python scripts/manage_database.py upgrade && exec uvicorn roadsense.cloud.api:create_app --factory --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: "2.0"
    mem_limit: 768m
  dashboard:
    build: .
    env_file:
      - ${ROADSENSE_CREDENTIAL_DIR:-./outputs/cloud-enterprise/credentials}/read.env
    environment:
      ROADSENSE_API_URL: http://api:8000
    command: ["streamlit", "run", "src/roadsense/dashboard/app.py", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:18501:8501"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:18443:8443"
    volumes:
      - ./configs/cloud/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - enterprise_caddy:/data
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
volumes:
  enterprise_postgres:
  enterprise_caddy:
