name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=84.1.0,<85'
      - run: python -m pip install -e '.[dev,audit]'
      - run: ruff format --check src scripts tests
      - run: ruff check src scripts tests
      - run: pytest -q
      - run: bandit -r src scripts -ll
      - run: python scripts/check_release.py --require-git
      - run: python -m build --outdir outputs/release
      - run: python -m twine check outputs/release/*
      - run: python scripts/check_release.py --artifacts outputs/release/*
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=84.1.0,<85'
      - run: python -m pip install -e '.[dashboard,review,audit]'
      - run: pip-audit --local --progress-spinner off

  vision-integration:
    runs-on: ubuntu-latest
    env:
      ROADSENSE_VISION_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/check_vision_environment.py --constraints /tmp/roadsense-vision-constraints.txt
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -c /tmp/roadsense-vision-constraints.txt -e '.[vision,dev]'
      - run: python scripts/check_vision_environment.py
      - run: python scripts/download_weights.py
      - run: pytest tests/test_vision_integration.py -q

  cloud-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roadsense_ci
          POSTGRES_USER: roadsense
          POSTGRES_PASSWORD: ci-only-local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadsense -d roadsense_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ROADSENSE_DATABASE_URL: postgresql+psycopg://roadsense:ci-only-local-postgres@127.0.0.1:5432/roadsense_ci
      ROADSENSE_API_KEY: ci-only-ephemeral-key-at-least-24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_enterprise.py -q
      - run: python scripts/verify_delivery_postgres.py --output outputs/postgres-ci
