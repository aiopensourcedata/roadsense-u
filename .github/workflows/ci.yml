name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=84.1.0,<85'
      - run: python -m pip install -e '.[dev,audit]'
      - run: ruff format --check src scripts tests
      - run: ruff check src scripts tests
      - run: pytest -q
      - run: bandit -r src scripts -ll
      - run: python scripts/check_release.py --require-git
      - run: python -m build --outdir outputs/release
      - run: python -m twine check outputs/release/*
      - run: python scripts/check_release.py --artifacts outputs/release/*
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=84.1.0,<85'
      - run: python -m pip install -e '.[dashboard,audit]'
      - run: pip-audit --local --progress-spinner off
