name: Browser end-to-end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=84.1.0,<85'
      - run: python -m pip install -e '.[dev,dashboard,e2e]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/init_local_env.py
      - run: docker compose up -d --build --wait
      - run: python scripts/run_e2e.py --screenshots outputs/e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-e2e
          path: |
            outputs/e2e-latest.json
            outputs/e2e-screenshots/*.png
            outputs/e2e-screenshots/provenance.json
          retention-days: 7
          if-no-files-found: warn
      - run: docker compose down
        if: always()
